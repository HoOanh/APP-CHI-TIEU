# Nginx reverse proxy cho Chi Tiêu Manager (pm2, cổng 3210).
#
# Cài đặt:
#   sudo cp deploy/nginx/spending.arc-irobot.tech.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/spending.arc-irobot.tech.conf /etc/nginx/sites-enabled/
#
# Lấy chứng chỉ lần đầu (khi chưa có cert, tạm comment khối server 443 rồi reload):
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d spending.arc-irobot.tech
# Sau đó bỏ comment khối 443:
#   sudo nginx -t && sudo systemctl reload nginx

upstream chi_tieu_app {
    server 127.0.0.1:3210;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name spending.arc-irobot.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spending.arc-irobot.tech;

    ssl_certificate     /etc/letsencrypt/live/spending.arc-irobot.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spending.arc-irobot.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Ảnh chụp hóa đơn / chuyển khoản gửi cho AI
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Gọi Gemini có thể mất vài chục giây
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # File build có hash trong tên, cache lâu được
    location /_next/static/ {
        proxy_pass http://chi_tieu_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cron chỉ gọi nội bộ từ pm2 (127.0.0.1:3210), không mở ra ngoài
    location = /api/cron/pwa-reminders {
        return 404;
    }

    location / {
        proxy_pass http://chi_tieu_app;
    }
}
