<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00b878">
    <title>Đang mất kết nối · ARC Irobot</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f1f5f9; color: #263445; }
      main { width: min(100% - 40px, 360px); box-sizing: border-box; padding: 28px; border: 1px solid #dce4ed; border-radius: 24px; background: #fff; text-align: center; }
      img { width: min(100%, 220px); height: auto; object-fit: contain; }
      h1 { margin: 22px 0 8px; font-size: 20px; }
      p { margin: 0; color: #718096; line-height: 1.6; }
      button { margin-top: 22px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 14px; background: #00b878; color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/arc-irobot.png" alt="ARC Irobot">
      <h1>Đang mất kết nối</h1>
      <p>Kết nối mạng để xem dữ liệu mới nhất và đồng bộ giao dịch.</p>
      <button type="button" onclick="location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
